<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pulse a glowing jellyfish between basalt stacks and dive through the ocean's depth zones.">
<style>
/* Base reset for the standalone page */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
</style>
<title>Midnight Jelly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Sometype+Mono:wght@400;600&display=swap">
<style>
/* Layout: one portrait porthole onto the deep sea, centred in the dark. Single-theme by choice. */
:root {
  color-scheme: dark;
  --trench: #030b18;
  --ink: #e4f8f6;
  --muted: #a6c5ce;
  --glow: #7cf5e3;
  --on-glow: #04202a;
  --line: rgba(124, 245, 227, .22);
  --panel: rgba(3, 11, 24, .62);
  --scrim: rgba(3, 11, 24, .82);
  --clear: rgba(3, 11, 24, 0);
  --font-display: "Monoton", "Arial Black", sans-serif;
  --font-body: "Sometype Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--trench); color: var(--ink); font-family: var(--font-body); }
.wrap {
  box-sizing: border-box;
  height: 100%;
  display: flex;
  overflow: auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage {
  position: relative;
  flex: none;
  margin: auto;
  width: 320px;
  height: 512px;
  max-width: 100%;
  container-type: size;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 0 0 1px var(--line);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
}
.stage:focus { outline: none; }
.stage:focus-visible { box-shadow: 0 0 0 2px var(--glow); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute;
  inset: 0 0 auto;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  padding: 3cqw 3.5cqw;
}
#depth {
  font-size: clamp(24px, 8.5cqw, 40px);
  font-weight: 600;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
#zone {
  font-size: clamp(11px, 3cqw, 13px);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--glow);
}
.controls { display: flex; gap: 6px; margin-left: auto; }
.controls button {
  font: inherit;
  font-size: clamp(11px, 3cqw, 13px);
  min-height: 32px;
  padding: 0 10px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
.controls button:hover { border-color: var(--glow); }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.toast {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  top: 25cqw;
  text-align: center;
  font-size: clamp(12px, 3.5cqw, 15px);
  color: var(--ink);
  opacity: 0;
  pointer-events: none;
}
.toast.show { animation: toast 2.6s ease-out both; }
@keyframes toast {
  0% { opacity: 0; transform: translateY(6px); }
  15%, 70% { opacity: 1; transform: none; }
  100% { opacity: 0; }
}

.overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 15cqw 6cqw 7cqw;
  background: linear-gradient(var(--scrim), var(--clear) 36%, var(--clear) 50%, var(--scrim) 72%);
}
.overlay.dim { background: var(--scrim); justify-content: center; gap: 6cqw; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 10.5cqw;
  line-height: 1.12;
  color: var(--glow);
  text-shadow: 0 0 18px var(--line);
  text-wrap: balance;
}
.lower { display: flex; flex-direction: column; align-items: flex-start; gap: 3cqw; }
.lower p {
  margin: 0;
  font-size: clamp(12px, 3.7cqw, 16px);
  line-height: 1.45;
}
#ovStat { color: var(--muted); }
#go {
  font: inherit;
  font-weight: 600;
  font-size: clamp(14px, 4.4cqw, 18px);
  min-height: 44px;
  padding: 0 20px;
  color: var(--on-glow);
  background: var(--glow);
  border: 0;
  border-radius: 4px;
  cursor: pointer;
}
#go:hover { filter: brightness(1.1); }
@media (prefers-reduced-motion: reduce) {
  .toast.show { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <main class="stage" id="stage" tabindex="0" aria-label="Midnight Jelly game. Press Space to pulse, P to pause.">
    <canvas id="c" aria-hidden="true"></canvas>
    <div class="hud">
      <div id="readout" hidden>
        <div id="depth">200 m</div>
        <div id="zone">Twilight zone</div>
      </div>
      <div class="controls">
        <button id="sound" type="button">Sound on</button>
        <button id="pause" type="button" hidden>Pause</button>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <section class="overlay" id="overlay">
      <h1 id="ovTitle">Midnight Jelly</h1>
      <div class="lower">
        <p id="ovText">Tap, click or press Space to pulse. Stop pulsing and you sink. Slip between the basalt stacks and stay off the seabed.</p>
        <p id="ovStat" aria-live="polite"></p>
        <button id="go" type="button">Start dive</button>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  // World units. The canvas scales to fit, so physics never depends on screen size.
  const W = 400, H = 640, FLOOR = H - 34;
  const JELLY_X = 110, HIT_R = 12, STACK_W = 62, SPACING = 230;
  const GRAVITY = 880, PULSE_V = -300, MAX_FALL = 400, STEP = 1 / 120;

  // Real ocean zones, by depth in metres.
  const ZONES = [
    { name: 'Twilight zone', from: 0,    top: [14, 62, 98], bot: [6, 24, 48],  jelly: [124, 245, 227] },
    { name: 'Midnight zone', from: 1000, top: [10, 30, 68], bot: [5, 12, 34],  jelly: [201, 150, 255] },
    { name: 'Abyssal zone',  from: 4000, top: [12, 16, 40], bot: [3, 6, 20],   jelly: [255, 178, 102] },
    { name: 'Hadal zone',    from: 6000, top: [24, 10, 34], bot: [6, 2, 12],   jelly: [255, 120, 160] },
  ];
  const NOTES = [392, 440, 523, 587, 659, 784, 880];
  const WORM = [255, 95, 126];

  const $ = id => document.getElementById(id);
  const wrap = $('wrap'), stage = $('stage'), canvas = $('c'), ctx = canvas.getContext('2d');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), ovStat = $('ovStat');
  const go = $('go'), soundBtn = $('sound'), pauseBtn = $('pause');
  const readout = $('readout'), depthEl = $('depth'), zoneEl = $('zone'), toast = $('toast');

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const depthOf = n => 200 + n * 200;
  const fmt = m => m.toLocaleString('en-US') + ' m';
  const zoneIndex = m => { let z = 0; ZONES.forEach((o, i) => { if (m >= o.from) z = i; }); return z; };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* the game works without saving */ } },
  };

  let best = parseInt(store.get('midnight-jelly-best'), 10) || 0;
  let muted = store.get('midnight-jelly-muted') === '1';

  let mode = 'attract';     // attract | play | paused | over
  let time = 0, dist = 0, score = 0, overAt = 0, shake = 0, pulseT = 0;
  let y = H * 0.45, vy = 0, stacks = [], rings = [], motes = [], zone = 0;
  const col = { top: ZONES[0].top.slice(), bot: ZONES[0].bot.slice(), jelly: ZONES[0].jelly.slice() };
  const snow = Array.from({ length: 55 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(.5, 1.9), a: rand(.15, .6) }));

  /* ---------- sound ---------- */
  let ac = null;
  function audio() {
    if (muted) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function tone(f0, f1, dur, type, vol, delay = 0) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  /* ---------- stacks ---------- */
  function columnPath() {
    // Drawn from the tip (y = 0) running away along +y; flipped for the upper stack.
    const p = new Path2D(), len = 720, segs = 24, w = STACK_W;
    p.moveTo(0, len);
    for (let i = segs - 1; i > 0; i--) p.lineTo(rand(0, 5), i / segs * len);
    p.lineTo(2, 6);
    p.quadraticCurveTo(w * .25, 0, w * .5, rand(0, 3));
    p.quadraticCurveTo(w * .75, 0, w - 2, 6);
    for (let i = 1; i < segs; i++) p.lineTo(w - rand(0, 5), i / segs * len);
    p.lineTo(w, len);
    p.closePath();
    return p;
  }
  const gapSize = () => Math.max(178 - score * 1.6, 136);
  const speedNow = () => Math.min(135 + score * 1.4, 180);
  function addStack(x) {
    const margin = 125;
    const prev = stacks.length ? stacks[stacks.length - 1].cy : H * 0.45;
    const cy = clamp(prev + rand(-140, 140), margin, FLOOR - margin);
    const amp = mode === 'play' && score >= 12 ? Math.min(6 + (score - 12) * 1.2, 26) : 0;
    stacks.push({ x, cy, amp, phase: rand(0, 6.28), gap: gapSize(), passed: false, up: columnPath(), down: columnPath() });
  }
  const centerOf = s => s.cy + Math.sin(time * 1.1 + s.phase) * s.amp;
  function circleHitsRect(cx, cy, r, x0, y0, x1, y1) {
    const dx = cx - clamp(cx, x0, x1), dy = cy - clamp(cy, y0, y1);
    return dx * dx + dy * dy < r * r;
  }

  /* ---------- actions ---------- */
  function pulse() {
    vy = PULSE_V;
    pulseT = 1;
    if (mode === 'play') {
      rings.push({ x: JELLY_X, y: y + 10, r: 8, a: .5 });
      tone(250, 120, .16, 'sine', .14);
    }
  }
  function setReadout() {
    const m = depthOf(score);
    depthEl.textContent = fmt(m);
    zoneEl.textContent = ZONES[zoneIndex(m)].name;
  }
  function showOverlay(title, text, stat, label, dim) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovStat.textContent = stat;
    go.textContent = label;
    overlay.classList.toggle('dim', dim);
    overlay.hidden = false;
  }
  function start() {
    mode = 'play';
    score = 0; zone = 0; dist = 0; shake = 0;
    y = H * 0.42; vy = 0;
    stacks = []; rings = []; motes = [];
    addStack(W + 90);
    overlay.hidden = true;
    readout.hidden = false;
    pauseBtn.hidden = false;
    toast.classList.remove('show');
    setReadout();
    pulse();
    stage.focus({ preventScroll: true });
  }
  function die() {
    mode = 'over';
    overAt = time;
    vy = Math.max(vy, 60);
    if (!reduced) shake = 9;
    for (let i = 0; i < 26; i++) {
      const a = rand(0, 6.28), s = rand(30, 170);
      motes.push({ x: JELLY_X, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.5, 1.2), c: col.jelly });
    }
    tone(190, 45, .5, 'triangle', .2);
    const newBest = score > best;
    if (newBest) { best = score; store.set('midnight-jelly-best', String(best)); }
    pauseBtn.hidden = true;
    const m = depthOf(score);
    const passed = score === 1 ? '1 stack passed.' : `${score} stacks passed.`;
    setTimeout(() => {
      if (mode !== 'over') return;
      readout.hidden = true;
      showOverlay('Dive over',
        `You reached ${fmt(m)} in the ${ZONES[zoneIndex(m)].name}. ${passed}`,
        newBest ? 'That is your deepest dive so far.' : `Deepest dive: ${fmt(depthOf(best))}.`,
        'Dive again', true);
    }, 500);
  }
  function setPaused(on) {
    if (on && mode === 'play') {
      mode = 'paused';
      showOverlay('Paused', 'Your dive is holding its depth.', 'Press Space or tap to carry on.', 'Resume', true);
      pauseBtn.textContent = 'Resume';
    } else if (!on && mode === 'paused') {
      mode = 'play';
      overlay.hidden = true;
      pauseBtn.textContent = 'Pause';
      pulse();
    }
  }
  function action() {
    if (mode === 'attract') start();
    else if (mode === 'play') pulse();
    else if (mode === 'paused') setPaused(false);
    else if (mode === 'over' && time - overAt > 0.55) start();
  }

  /* ---------- simulation ---------- */
  function step(dt) {
    time += dt;
    const target = ZONES[zone];
    const k = Math.min(1, dt * 1.2);
    col.top = mix(col.top, target.top, k);
    col.bot = mix(col.bot, target.bot, k);
    col.jelly = mix(col.jelly, target.jelly, k);
    pulseT = Math.max(0, pulseT - dt * 4.5);
    shake = Math.max(0, shake - dt * 22);

    const moving = mode !== 'over';
    const speed = speedNow();
    if (moving) {
      dist += speed * dt;
      for (const s of stacks) s.x -= speed * dt;
      if (stacks.length && stacks[0].x < -STACK_W - 10) stacks.shift();
      if (!stacks.length || stacks[stacks.length - 1].x < W + 20 - SPACING) addStack(W + 20);
    }

    for (const f of snow) {
      f.x -= (moving ? speed : 14) * (.1 + f.r * .1) * dt;
      f.y += 9 * dt;
      if (f.x < -3) f.x = W + 3;
      if (f.y > H) f.y = -3;
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += 70 * dt; r.a -= 1.1 * dt;
      if (moving) r.x -= speed * dt;
      if (r.a <= 0) rings.splice(i, 1);
    }
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.life -= dt;
      m.x += m.vx * dt; m.y += m.vy * dt;
      m.vx *= 1 - 1.5 * dt; m.vy *= 1 - 1.5 * dt;
      if (m.life <= 0) motes.splice(i, 1);
    }

    if (mode === 'attract') {
      // The title screen plays itself: the jelly steers through the stacks with no collisions.
      const next = stacks.find(s => s.x + STACK_W > JELLY_X - 10);
      const goal = next ? centerOf(next) + 16 : H * .45;
      if (y > goal && vy > -20) pulse();
    }

    vy = Math.min(vy + GRAVITY * dt, MAX_FALL);
    y += vy * dt;
    if (y < 18) { y = 18; vy = Math.max(vy, 0); }

    if (mode === 'over') {
      if (y + HIT_R > FLOOR) { y = FLOOR - HIT_R; vy = 0; }
      return;
    }
    if (mode === 'attract') {
      if (y + HIT_R > FLOOR) { y = FLOOR - HIT_R; pulse(); }
      return;
    }

    // mode === 'play'
    if (y + HIT_R >= FLOOR) { y = FLOOR - HIT_R; die(); return; }
    for (const s of stacks) {
      const c = centerOf(s), half = s.gap / 2, x1 = s.x + STACK_W;
      if (circleHitsRect(JELLY_X, y, HIT_R, s.x, -200, x1, c - half) ||
          circleHitsRect(JELLY_X, y, HIT_R, s.x, c + half, x1, FLOOR)) { die(); return; }
      if (!s.passed && x1 < JELLY_X - HIT_R) {
        s.passed = true;
        score++;
        setReadout();
        tone(NOTES[score % 7], NOTES[score % 7], .28, 'triangle', .12);
        for (let i = 0; i < 9; i++) {
          motes.push({ x: x1, y: c + rand(-half, half), vx: rand(-20, 50), vy: rand(-26, 26), life: rand(.4, .9), c: col.jelly });
        }
        const z = zoneIndex(depthOf(score));
        if (z !== zone) {
          zone = z;
          toast.textContent = `Entering the ${ZONES[z].name} at ${fmt(ZONES[z].from)}`;
          toast.classList.remove('show');
          void toast.offsetWidth;
          toast.classList.add('show');
          tone(392, 392, .4, 'sine', .12);
          tone(784, 784, .5, 'sine', .1, .14);
        }
      }
    }
  }

  /* ---------- drawing ---------- */
  function glow(x, yy, r, c, a) {
    const g = ctx.createRadialGradient(x, yy, 0, x, yy, r);
    g.addColorStop(0, rgba(c, a));
    g.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - r, yy - r, r * 2, r * 2);
  }
  function ridge(base, amp, f1, f2, par, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W + 16; x += 16) {
      const u = x + dist * par;
      ctx.lineTo(x, base + Math.sin(u * f1) * amp + Math.sin(u * f2 + 1.7) * amp * .55);
    }
    ctx.lineTo(W + 16, H);
    ctx.closePath();
    ctx.fill();
  }
  function drawStack(s, rockLit, rockDark) {
    const c = centerOf(s), half = s.gap / 2;
    const grad = ctx.createLinearGradient(0, 0, STACK_W, 0);
    grad.addColorStop(0, rgba(rockLit, 1));
    grad.addColorStop(1, rgba(rockDark, 1));
    for (const dir of [-1, 1]) {
      ctx.save();
      ctx.translate(s.x, c + dir * half);
      ctx.scale(1, dir);
      ctx.fillStyle = grad;
      ctx.fill(dir < 0 ? s.up : s.down);
      ctx.strokeStyle = rgba(col.jelly, .24);
      ctx.lineWidth = 1;
      ctx.stroke(dir < 0 ? s.up : s.down);
      // Red-plumed tube worms mark the edge of the gap.
      ctx.globalCompositeOperation = 'lighter';
      glow(STACK_W / 2, 0, 40, WORM, .2);
      ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 5; i++) {
        const wx = 8 + i * (STACK_W - 16) / 4;
        const sway = Math.sin(time * 2.4 + i * 1.3 + s.phase) * .9;
        ctx.strokeStyle = 'rgba(240,226,214,.75)';
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(wx, 13); ctx.lineTo(wx + sway, 6); ctx.stroke();
        ctx.fillStyle = rgba(WORM, 1);
        ctx.beginPath(); ctx.arc(wx + sway, 5, 2.6, 0, 6.29); ctx.fill();
      }
      ctx.restore();
    }
  }
  function drawJelly() {
    const c = col.jelly, s = pulseT;
    const bw = 18 * (1 - .24 * s), bh = 16 * (1 + .2 * s);
    ctx.save();
    ctx.translate(JELLY_X, y);
    ctx.globalCompositeOperation = 'lighter';
    glow(0, 0, 66 + s * 20, c, .3 + s * .16);
    ctx.globalCompositeOperation = 'source-over';
    ctx.rotate(clamp(vy / MAX_FALL, -1, 1) * .34);

    // Tentacles stream behind and stretch on the upstroke.
    const len = 30 + s * 12;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = rgba(c, .68);
    for (let i = 0; i < 6; i++) {
      const x0 = -bw * .72 + i * (bw * 1.44) / 5;
      ctx.beginPath();
      ctx.moveTo(x0, 2);
      for (let j = 1; j <= 8; j++) {
        const px = x0 - j * .95 + Math.sin(time * 5 + i * 1.2 + j * .75) * j * .42;
        ctx.lineTo(px, 2 + j * len / 8);
      }
      ctx.stroke();
    }
    // Bell with a scalloped rim.
    const g = ctx.createLinearGradient(0, -bh, 0, 5);
    g.addColorStop(0, rgba(mix(c, [255, 255, 255], .45), .96));
    g.addColorStop(1, rgba(c, .42));
    ctx.fillStyle = g;
    ctx.strokeStyle = rgba(mix(c, [255, 255, 255], .5), .9);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-bw, 3);
    ctx.bezierCurveTo(-bw, -bh * 1.35, bw, -bh * 1.35, bw, 3);
    const n = 5, sw = (bw * 2) / n;
    for (let i = 0; i < n; i++) {
      const x1 = bw - sw * i, x2 = x1 - sw;
      ctx.quadraticCurveTo((x1 + x2) / 2, 8, x2, 3);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Four pale gonad rings, the mark of a moon jelly.
    ctx.strokeStyle = 'rgba(255,255,255,.62)';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.ellipse(-bw * .48 + i * bw * .32, -bh * .36, 2.6, 3.4, 0, 0, 6.29);
      ctx.stroke();
    }
    ctx.restore();
  }
  function draw() {
    const sc = canvas.width / W;
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.globalAlpha = 1;
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, rgba(col.top, 1));
    bg.addColorStop(1, rgba(col.bot, 1));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    ridge(H - 150, 34, .011, .027, .22, rgba(mix(col.bot, col.top, .28), .85));
    ridge(H - 88, 26, .017, .041, .45, rgba(mix(col.bot, col.top, .1), .95));

    for (const f of snow) {
      ctx.fillStyle = `rgba(226,244,244,${f.a})`;
      ctx.fillRect(f.x, f.y, f.r, f.r);
    }

    const rockLit = mix(col.jelly, col.bot, .76), rockDark = mix(col.jelly, col.bot, .93);
    for (const s of stacks) drawStack(s, rockLit, rockDark);

    ridge(FLOOR, 2.5, .05, .13, 1, rgba(mix(col.bot, col.jelly, .2), 1));

    for (const r of rings) {
      ctx.strokeStyle = rgba(col.jelly, Math.max(r.a, 0));
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, 6.29);
      ctx.stroke();
    }
    drawJelly();
    for (const m of motes) {
      ctx.fillStyle = rgba(m.c, clamp(m.life * 1.5, 0, 1));
      ctx.beginPath();
      ctx.arc(m.x, m.y, 1.7, 0, 6.29);
      ctx.fill();
    }
  }

  let last = 0, acc = 0;
  function frame(ts) {
    const dt = Math.min((ts - last) / 1000 || 0, .05);
    last = ts;
    if (mode !== 'paused') {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
    }
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- layout ---------- */
  function resize() {
    const cs = getComputedStyle(wrap);
    const cw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ch = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let w = Math.min(cw, ch * W / H);
    w = Math.max(w, Math.min(cw, 280));
    stage.style.width = Math.floor(w) + 'px';
    stage.style.height = Math.floor(w * H / W) + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(w * H / W * dpr);
    draw();
  }

  /* ---------- input ---------- */
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    stage.focus({ preventScroll: true });
    action();
  });
  go.addEventListener('click', () => {
    if (mode === 'paused') { setPaused(false); stage.focus({ preventScroll: true }); }
    else start();
  });
  pauseBtn.addEventListener('click', () => {
    setPaused(mode === 'play');
    stage.focus({ preventScroll: true });
  });
  function paintSound() { soundBtn.textContent = muted ? 'Sound off' : 'Sound on'; }
  soundBtn.addEventListener('click', () => {
    muted = !muted;
    store.set('midnight-jelly-muted', muted ? '1' : '0');
    paintSound();
    stage.focus({ preventScroll: true });
  });
  window.addEventListener('keydown', e => {
    const onButton = e.target instanceof Element && e.target.closest('button');
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (onButton && e.code === 'Space') return;
      e.preventDefault();
      if (!e.repeat) action();
    } else if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
      if (mode === 'play') setPaused(true);
      else if (mode === 'paused') setPaused(false);
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) setPaused(true);
  });

  /* ---------- boot ---------- */
  paintSound();
  ovStat.textContent = best
    ? `Deepest dive: ${fmt(depthOf(best))}.`
    : 'You start at 200 m. New zones open at 1,000, 4,000 and 6,000 m.';
  // Run the title-screen demo ahead so the first frame already shows the trench.
  for (let i = 0; i < 480; i++) step(STEP * 2);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
